services:
  postgres:
    image: postgres:17-alpine
    container_name: analytics-dashboard-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: analytics_dashboard
      POSTGRES_PASSWORD: analytics_dashboard
      POSTGRES_DB: analytics_dashboard
    volumes:
      - analytics_dashboard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics_dashboard -d analytics_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  analytics_dashboard_postgres_data:
